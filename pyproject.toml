[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautical"
version = "0.0.1"
description = "Phonetic Creativity Workbench - offline rhyme discovery engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cmudict>=1.0.13",
    "wordfreq>=3.0.0",
    "typer>=0.16.0",
    "rich>=13.0.0",
    "g2p_en>=2.1.0",
    "panphon>=0.20.0",
    "numpy>=1.24",
    "editdistance>=0.8.1",
    "platformdirs>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
nautical = "nautical.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nautical.db" = ["*.sql"]
"nautical.resources" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    "slow: cold-query latency budgets (U4 acceptance)",
]
